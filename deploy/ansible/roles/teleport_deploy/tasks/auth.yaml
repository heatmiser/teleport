---
- name: "Auth | Ensure configuration, secret, and data directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "/etc/teleport"
    - "/etc/teleport/certs"
    - "/etc/teleport/secrets"
    - "/var/lib/teleport"
    - "/etc/containers/systemd"

- name: "Auth | Template Teleport Auth Server configuration"
  ansible.builtin.template:
    src: "teleport-auth.yaml.j2"
    dest: "/etc/teleport/teleport-auth.yaml"
    mode: "0600"
    backup: true

- name: "Auth | Template FreeIPA LDAP authentication connector"
  ansible.builtin.template:
    src: "freeipa-connector.yaml.j2"
    dest: "/etc/teleport/freeipa-connector.yaml"
    mode: "0600"
    backup: true

- name: "Auth | Template Teleport Auth Quadlet unit file"
  ansible.builtin.template:
    src: "teleport-auth.container.j2"
    dest: "/etc/containers/systemd/teleport-auth.container"
    mode: "0644"
    backup: true

- name: "Auth | Ensure Teleport Auth systemd service is started and enabled"
  ansible.builtin.systemd_service:
    name: "teleport-auth.service"
    state: started
    enabled: true
    daemon_reload: true
...
